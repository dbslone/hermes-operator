name: ci
# While the project is in early development CI runs on every commit to any branch.
# When we move to PR-only checks, replace the `push` trigger below with
# `pull_request:` (see plans/0004-ci-on-every-commit.md). The PR-only "adds a plan"
# rule lives in pr-plan.yaml so the heavy jobs never run twice.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./... && go build ./...
      - name: unit tests + 90% coverage gate
        run: test/coverage.sh
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.out }

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: make chart-lint chart-test

  plans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: plans are named correctly and linked from README
        run: test/plans.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
      - run: docker build -t hermes-operator:e2e .
      - run: kind load docker-image hermes-operator:e2e
      - run: IMG=hermes-operator:e2e test/e2e.sh
