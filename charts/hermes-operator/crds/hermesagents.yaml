apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hermesagents.hermesoperator.io
spec:
  group: hermesoperator.io
  scope: Namespaced
  names:
    kind: HermesAgent
    listKind: HermesAgentList
    plural: hermesagents
    singular: hermesagent
    shortNames: [hagent]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: Provider, type: string, jsonPath: .spec.model.provider }
        - { name: Model, type: string, jsonPath: .spec.model.name }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                  description: Hermes image. Defaults to the operator-wide default.
                model:
                  type: object
                  properties:
                    provider: { type: string }
                    name: { type: string }
                    baseURL: { type: string }
                config:
                  type: string
                  description: Full config.yaml, replaces the one generated from `model`. Seeded on first boot only.
                soul:
                  type: string
                  description: Contents of SOUL.md. Seeded on first boot only.
                env:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                envFrom:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                resources:
                  type: object
                  description: Overrides the operator-wide default requests/limits.
                  x-kubernetes-preserve-unknown-fields: true
                storage:
                  type: object
                  properties:
                    size: { type: string }
                    storageClassName: { type: string }
                dashboard: { type: boolean }
                suspended: { type: boolean }
                retainData: { type: boolean }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
