<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hermes Agents</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--fg:#14171f;--mut:#667085;--line:#e3e6ec;--acc:#4f46e5;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--fg:#e8ebf0;--mut:#8b94a5;--line:#262c38;--acc:#818cf8}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
  main{max-width:960px;margin:0 auto;padding:24px 16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
  h1{font-size:20px;margin:0}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 14px}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  button.danger{color:var(--bad)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
  .card h2{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .mut{color:var(--mut);font-size:12px;word-break:break-all}
  .pill{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
  .Ready{color:var(--ok)} .Pending{color:var(--warn)} .Failed{color:var(--bad)} .Suspended{color:var(--mut)}
  .empty{padding:40px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:12px}
  dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);width:min(480px,calc(100vw - 32px));padding:20px}
  dialog::backdrop{background:#0008}
  label{display:block;margin:10px 0 3px;font-size:12px;color:var(--mut)}
  input,textarea,select{width:100%;font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
  textarea{min-height:70px;resize:vertical}
  .row{display:flex;gap:8px} .row>*{flex:1}
  details{margin-top:12px} summary{cursor:pointer;color:var(--mut)}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
  #keySteps{margin:8px 0 12px;padding-left:1.2em} #keySteps li{margin:4px 0}
  a{color:var(--acc)}
  select:disabled,input:disabled{opacity:.55}
  #err,#modelErr{color:var(--bad);margin-top:10px;min-height:1em}
</style>
</head>
<body>
<main>
  <header>
    <h1>Hermes Agents</h1>
    <button class="primary" id="new">+ New agent</button>
  </header>
  <div id="list" class="grid"></div>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 style="margin:0 0 4px">New agent</h2>
    <label>Name</label><input id="name" required pattern="[a-z][-a-z0-9]{0,38}[a-z0-9]?" placeholder="research-bot">
    <label>Provider</label>
    <select id="provider"><option value="">Default</option></select>
    <input id="providerCustom" placeholder="provider id" hidden>
    <div id="keyRow" hidden>
      <label for="apiKey">API key</label>
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false">
      <ol id="keySteps"></ol>
      <div><a id="keyLink" target="_blank" rel="noopener noreferrer" hidden></a></div>
    </div>
    <label>Model</label>
    <select id="modelSel" disabled></select>
    <input id="model" autocomplete="off" placeholder="model id" hidden>
    <div id="modelErr"></div>
    <div class="mut" id="modelNote"></div>
    <label>Soul / instructions (optional)</label><textarea id="soul" placeholder="You are a helpful research assistant…"></textarea>
    <details>
      <summary>API keys &amp; advanced</summary>
      <label>Environment variables, one per line as KEY=value (leave empty to use shared operator keys)</label>
      <textarea id="env" placeholder="OPENROUTER_API_KEY=sk-..." spellcheck="false"></textarea>
      <div class="mut">A key pasted here is copied into the API key line for the chosen provider and saved on the agent.</div>
      <label>Base URL (custom OpenAI-compatible endpoint)</label><input id="baseurl">
      <div class="row">
        <div><label>CPU request</label><input id="cpuReq" placeholder="default"></div>
        <div><label>Memory request</label><input id="memReq" placeholder="default"></div>
      </div>
      <div class="row">
        <div><label>CPU limit</label><input id="cpuLim" placeholder="default"></div>
        <div><label>Memory limit</label><input id="memLim" placeholder="default"></div>
      </div>
      <label>Storage size</label><input id="storage" placeholder="default (2Gi)">
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="dash" style="width:auto"> Enable Hermes dashboard</label>
    </details>
    <div id="err"></div>
    <div class="actions">
      <button type="button" id="cancel">Cancel</button>
      <button class="primary" id="create" type="submit">Create</button>
    </div>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
const api = (path, opts) => fetch(path, opts).then(async r => {
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j; });

async function load() {
  try {
    const agents = await api('api/agents');
    $('list').innerHTML = agents.length ? '' : '<div class="empty" style="grid-column:1/-1">No agents yet. Create your first one.</div>';
    for (const a of agents) {
      const el = document.createElement('div'); el.className = 'card';
      el.innerHTML = `<h2><span></span><span class="pill ${a.phase}">${a.phase}</span></h2>
        <div class="mut"></div><div class="mut"></div><div class="mut"></div>
        <div><button class="danger">Delete</button></div>`;
      el.querySelector('h2 span').textContent = a.name;
      const m = el.querySelectorAll('.mut');
      m[0].textContent = [a.provider, a.model].filter(Boolean).join(' / ') || 'default model';
      m[1].textContent = a.endpoint || '';
      m[2].textContent = a.apiKeySecret ? `key: kubectl get secret ${a.apiKeySecret} -n ${a.namespace}` : '';
      el.querySelector('button').onclick = async () => {
        if (el.dataset.arm !== '1') { el.dataset.arm = '1'; el.querySelector('button').textContent = 'Click again to delete'; return; }
        await api('api/agents/' + a.name, {method: 'DELETE'}).catch(e => alert(e.message)); load();
      };
      $('list').append(el);
    }
  } catch (e) { $('list').innerHTML = `<div class="empty" style="grid-column:1/-1">${e.message}</div>`; }
}

let providers = [];
const providerId = () => $('provider').value === '__custom' ? $('providerCustom').value.trim() : $('provider').value;
const envMap = () => {
  const env = {};
  for (const line of $('env').value.split('\n')) {
    const i = line.indexOf('='); if (i > 0) env[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  }
  return env;
};
async function loadProviders() {
  try { providers = await api('api/providers'); } catch (e) { providers = []; }
  const sel = $('provider');
  const prev = sel.value;
  sel.innerHTML = '<option value="">Default</option>';
  for (const p of providers) sel.append(new Option(p.label, p.id));
  sel.append(new Option('Other…', '__custom'));
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
}
const knownProvider = () => providers.find(x => x.id === providerId());
const keyValue = () => $('apiKey').value.trim();
function modelName() {
  if (!$('modelSel').hidden && $('modelSel').value !== '__custom') return $('modelSel').value;
  return $('model').value.trim();
}
function fillSelect(sel, models) {
  sel.innerHTML = '';
  sel.append(new Option('Default', ''));
  for (const m of models) sel.append(new Option(m, m));
  sel.append(new Option('Other…', '__custom'));
}
function showModelSelect(models) {
  const prev = modelName();
  fillSelect($('modelSel'), models);
  $('modelSel').hidden = false; $('modelSel').disabled = false;
  $('model').hidden = true; $('model').disabled = false; $('model').value = '';
  if (models.includes(prev)) $('modelSel').value = prev;
}
function showModelText() {
  $('modelSel').hidden = true; $('modelSel').innerHTML = ''; $('modelSel').disabled = false;
  $('model').hidden = false; $('model').disabled = false;
}
function disableModel(message) {
  if (!$('modelSel').options.length) $('modelSel').append(new Option('Default', ''));
  $('modelSel').hidden = false; $('modelSel').disabled = true;
  $('model').hidden = true; $('model').disabled = true;
  $('modelErr').textContent = message;
  $('modelNote').textContent = '';
}
function safeURL(u) {
  try { const x = new URL(u); return x.protocol === 'https:' || x.protocol === 'http:' ? x.href : ''; }
  catch (e) { return ''; }
}
// The API key line sits between provider and model for every provider with a key env:
// the agent needs the key at runtime even when listing models does not (needsKey).
function syncKeyRow() {
  const p = knownProvider();
  if (!p || !p.keyEnv) { $('keyRow').hidden = true; return; }
  $('keyRow').hidden = false;
  const ol = $('keySteps');
  ol.replaceChildren();
  const steps = p.keySteps && p.keySteps.length ? p.keySteps : [`Paste a ${p.keyEnv} key.`];
  for (const s of steps) { const li = document.createElement('li'); li.textContent = s; ol.append(li); }
  const url = safeURL(p.keyURL);
  if (url) { $('keyLink').hidden = false; $('keyLink').href = url; $('keyLink').textContent = url; }
  else { $('keyLink').hidden = true; $('keyLink').removeAttribute('href'); }
  if (!keyValue() && envMap()[p.keyEnv]) $('apiKey').value = envMap()[p.keyEnv];
}
$('modelSel').onchange = () => { $('model').hidden = $('modelSel').value !== '__custom'; };
// Wait so a half-typed key is not sent on every keystroke.
const KEY_WAIT = 200;
let keyTimer = 0, modelSeq = 0, shownProvider = '';
function scheduleModels() {
  clearTimeout(keyTimer);
  $('providerCustom').hidden = $('provider').value !== '__custom';
  const id = providerId();
  if (id !== shownProvider) { $('apiKey').value = ''; shownProvider = id; }
  syncKeyRow();
  const p = knownProvider();
  if (p && p.needsKey && !keyValue()) { modelSeq++; disableModel('API key is required'); return; }
  if (p && p.needsKey) { modelSeq++; keyTimer = setTimeout(loadModels, KEY_WAIT); return; }
  loadModels();
}
async function loadModels() {
  const seq = ++modelSeq, note = $('modelNote'), p = knownProvider();
  note.textContent = ''; $('modelErr').textContent = '';
  if (!p) { showModelText(); return; }
  const key = p.needsKey ? keyValue() : (envMap()[p.keyEnv] || '');
  if (p.needsKey && !key) { disableModel('API key is required'); return; }
  try {
    const r = await api('api/models', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({provider: p.id, apiKey: key})});
    if (seq !== modelSeq) return;
    if (r.models && r.models.length) {
      showModelSelect(r.models);
      const source = p.runtimeProvider
        ? ((providers.find((x) => x.id === p.runtimeProvider) || {}).label || p.runtimeProvider)
        : p.label;
      note.textContent = `${r.models.length} models from ${source}. Choose "Other…" to type any model id.`;
    } else {
      showModelText();
      note.textContent = `No models returned from ${p.label}. Type a model id.`;
    }
  } catch (e) {
    if (seq !== modelSeq) return;
    disableModel(e.message);
  }
}
$('provider').onchange = scheduleModels;
$('providerCustom').oninput = scheduleModels;
$('apiKey').oninput = () => {
  missingKeyWarned = false;
  if (knownProvider() && !knownProvider().needsKey) return; // listing doesn't use it
  shownProvider = providerId(); scheduleModels();
};
$('env').onchange = () => { shownProvider = providerId(); scheduleModels(); };
$('new').onclick = async () => {
  $('err').textContent = ''; $('modelErr').textContent = ''; $('apiKey').value = ''; shownProvider = ''; missingKeyWarned = false;
  $('dlg').showModal(); await loadProviders(); scheduleModels();
};
$('cancel').onclick = () => $('dlg').close();
async function createAgent() {
  const env = envMap();
  const p = knownProvider();
  const key = keyValue();
  if (p && p.keyEnv && key) env[p.keyEnv] = key;
  const pick = (c, m) => { const o = {}; if ($(c).value) o.cpu = $(c).value; if ($(m).value) o.memory = $(m).value; return o; };
  const requests = pick('cpuReq', 'memReq'), limits = pick('cpuLim', 'memLim');
  const body = { name: $('name').value, soul: $('soul').value, env, dashboard: $('dash').checked,
    storageSize: $('storage').value,
    model: { provider: (p && p.runtimeProvider) || providerId(), name: modelName(), baseURL: $('baseurl').value } };
  if (Object.keys(requests).length || Object.keys(limits).length) body.resources = { requests, limits };
  try {
    await api('api/agents', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    $('dlg').close(); $('form').reset(); $('apiKey').value = ''; shownProvider = ''; showModelText(); load();
  } catch (e) { $('err').textContent = e.message; }
}
// Without its key the agent cannot call the model, so warn once; a second click creates
// anyway for operators that share keys through the defaults secret.
let missingKeyWarned = false;
$('form').onsubmit = async ev => {
  ev.preventDefault();
  const p = knownProvider();
  if (p && p.needsKey && !keyValue()) { disableModel('API key is required'); return; }
  if (p && p.keyEnv && !keyValue() && !envMap()[p.keyEnv] && !missingKeyWarned) {
    missingKeyWarned = true;
    $('err').textContent = `No ${p.keyEnv} entered. The agent cannot call the model without it unless the operator shares one. Click Create again to continue anyway.`;
    return;
  }
  missingKeyWarned = false;
  await createAgent();
};
load(); setInterval(load, 4000);
</script>
</body>
</html>
